Resources:
  LambdaRole:
    Condition: send_telemetry_to_sumo
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Operations are performed across resources."
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: LambdaExecutePolicies
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:DeleteFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*TelemetryLambda*'
        - PolicyName: BasicLambdaPolicies
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
        - PolicyName: CloudFormationRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:Describe*
                Resource: !Sub '${AWS::StackId}'

  TelemetryLambda:
    Condition: send_telemetry_to_sumo
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Lambda function does not require VPC deployment."
          - id: W92
            reason: "Lambda function does not require reserved concurrency."
    Properties:
      Handler: lambda_function.lambda_handler
      Runtime: python3.14
      Code:
        S3Bucket: !FindInMap [ RegionMap, !Ref 'AWS::Region', bucketname ]
        S3Key: "sumologic-aws-observability/functions/telemetry/v1.1.0/telemetry.zip"
      MemorySize: 128
      Timeout: 900
      Role: !GetAtt LambdaRole.Arn

  LambdaPermission:
    Condition: send_telemetry_to_sumo
    Type: 'AWS::Lambda::Permission'
    # DeletionPolicy: Retain
    Properties:
      FunctionName: !GetAtt TelemetryLambda.Arn
      Action: 'lambda:InvokeFunction'
      Principal: 'cloudformation.amazonaws.com'
  
  PrimerInvoke:
    Condition: send_telemetry_to_sumo
    Type: AWS::CloudFormation::CustomResource
    Version: "1.0"
    Properties:
      ServiceToken: !GetAtt TelemetryLambda.Arn
      Handler: lambda_function.lambda_handler
      stackID:
          Ref: "AWS::StackId"
      sumoDeployment:
          !Ref Section1aSumoLogicDeployment
      sumoOrgId:
          !Ref Section1dSumoLogicOrganizationId
      solutionName: 'AWSO'
      solutionVersion: 'v3.0.0'
      deploymentSource: 'cloudFormation'
      TelemetryEndpoint: "https://endpoint1.collection.us2.sumologic.com/receiver/v1/http/ZaVnC4dhaV1S68eao6UYB3LFtqQ7ur1xYlT1EHCfXdhvi6uPNc0aUXIpvq5i_aHewOp5xxxwnGZ5MmSWDR6qV5td4exMM4pZE4Tk6rqKvgextLx7I6IRpg=="
      scanInterval: 60
      ToUpdate: 
        Fn::Base64: !Sub
          - "${a}-${b}-${c}-${d}-${e}-${f}-${g}-${h}-${i}-${j}-${k}-${l}-${m}-${n}-${o}-${p}-${q}-${r}-${s}-${t}-${u}-${v}-${w}"
          - a: !Ref Section2aAccountAlias
            b: !Ref Section3aInstallObservabilityApps
            c: !Ref Section4aCreateMetricsSourceOptions
            d: !Ref Section4bMetricsNameSpaces
            e: !Ref Section4cCloudWatchExistingSourceAPIUrl
            f: !Ref Section4dAWSMetricsTagFilters
            g: !Ref Section5aAutoEnableS3LogsALBResourcesOptions
            h: !Ref Section5bALBCreateLogSource
            i: !Ref Section5cALBLogsSourceUrl
            j: !Ref Section5dALBS3LogsBucketName
            k: !Ref Section6aCreateCloudTrailLogSource
            l: !Ref Section6bCloudTrailLogsSourceUrl
            m: !Ref Section6cCloudTrailLogsBucketName
            n: !Ref Section7aCreateCloudWatchLogsSourceOptions
            o: !Ref Section7bCloudWatchLogsSourceUrl
            p: !Ref Section7cAutoSubscribeLogGroupsOptions
            q: !Ref Section7dAutoSubscribeLogGroupPattern
            r: !Ref Section7eAutoSubscribeLogGroupByTags
            s: !Ref Section8aAutoEnableS3LogsELBResourcesOptions
            t: !Ref Section8bELBCreateLogSource
            u: !Ref Section8cELBLogsSourceUrl
            v: !Ref Section8dELBS3LogsBucketName
            w: !FindInMap [CommonData, NestedTemplate, MPS3KeyPrefix]

  CreateCommonResources:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub
        - "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}resources.template.yaml"
        - MPS3BucketName: !FindInMap [CommonData, NestedTemplate, MPS3BucketName]
          MPS3BucketRegion: !FindInMap [CommonData, NestedTemplate, MPS3BucketRegion]
          MPS3KeyPrefix: !FindInMap [CommonData, NestedTemplate, MPS3KeyPrefix]
      Parameters:
        SumoLogicDeployment: !Ref Section1aSumoLogicDeployment
        SumoLogicAccessID: !Ref Section1bSumoLogicAccessID
        SumoLogicAccessKey: !Ref Section1cSumoLogicAccessKey
        SumoLogicOrganizationId: !Ref Section1dSumoLogicOrganizationId
        RemoveSumoLogicResourcesOnDeleteStack: !Ref Section1eSumoLogicResourceRemoveOnDeleteStack
        AccountAlias: !Ref Section2aAccountAlias
        AccountAliasMappingS3URL: !Ref Section2bAccountAliasMappingS3URL
        SumoLogicAccountID: !FindInMap [SumoAWSAccountIDs, !Ref "AWS::Partition", SumoAWSAccountID]
        CreateMetaDataSource: "No"
        CreateCloudWatchMetricsSource: !If [ create_cw_metrics_source, "Yes", "No" ]
        CloudWatchMetricsSourceName: !Sub "cloudwatch-metrics-${AWS::Region}"
        CloudWatchMetricsNameSpaces: !Ref Section4bMetricsNameSpaces
        CloudWatchMetricSourceCategory: !FindInMap [CommonData, CollectorDetails, CloudWatchMetricSourceCategory]
        MetricsSourceAWSTagFilters: !Ref Section4dAWSMetricsTagFilters
        ScanInterval: 300000
        CreateKinesisFirehoseMetricsSource: !If [ create_kf_metrics_source, "Yes", "No" ]
        KinesisFirehoseMetricsSourceName: !Sub "cloudwatch-metrics-${AWS::Region}"
        KinesisFirehoseMetricSourceCategory: !FindInMap [ CommonData, CollectorDetails, CloudWatchMetricSourceCategory ]
        CreateALBLogSource: !Ref Section5bALBCreateLogSource
        CreateALBS3Bucket: !If [create_alb_bucket, "Yes", "No"]
        ALBS3LogsBucketName: !Ref Section5dALBS3LogsBucketName
        ALBS3BucketPathExpression: !If [auto_enable_s3_logs, !Sub "*AWSLogs/${AWS::AccountId}/elasticloadbalancing/${AWS::Region}/*.log.gz", !Ref Section5eALBS3BucketPathExpression]
        ALBLogsSourceName: !Sub "alb-logs-${AWS::Region}"
        ALBLogsSourceCategory: !FindInMap [CommonData, CollectorDetails, ALBLogsSourceCategory]
        CreateCloudTrailLogSource: !Ref Section6aCreateCloudTrailLogSource
        CreateCloudTrailBucket: !If [create_cloudtrail_bucket, "Yes", "No"]
        CloudTrailLogsBucketName: !Ref Section6cCloudTrailLogsBucketName
        CloudTrailBucketPathExpression: !If [create_cloudtrail_bucket, !Sub "AWSLogs/${AWS::AccountId}/CloudTrail/${AWS::Region}/*", !Ref Section6dCloudTrailBucketPathExpression]
        CloudTrailLogsSourceName: !Sub "cloudtrail-logs-${AWS::Region}"
        CloudTrailLogsSourceCategory: !FindInMap [CommonData, CollectorDetails, CloudTrailLogsSourceCategory]
        CreateCloudWatchLogSource: !If [ create_cw_logs_source, "Yes", "No" ]
        CloudWatchLogsSourceName: !Sub "cloudwatch-logs-${AWS::Region}"
        CloudWatchLogsSourceCategory: !FindInMap [CommonData, CollectorDetails, CloudWatchLogsSourceCategory]
        CreateKinesisFirehoseLogSource: !If [ create_kf_logs_source, "Yes", "No" ]
        KinesisFirehoseLogsSourceName: !Sub "kinesis-firehose-cloudwatch-logs-${AWS::Region}"
        KinesisFirehoseLogsSourceCategory: !FindInMap [ CommonData, CollectorDetails, CloudWatchLogsSourceCategory ]
        MPS3BucketName: !FindInMap [CommonData, NestedTemplate, MPS3BucketName]
        MPS3BucketRegion: !FindInMap [CommonData, NestedTemplate, MPS3BucketRegion]
        MPS3KeyPrefix: !FindInMap [CommonData, NestedTemplate, MPS3KeyPrefix]
        ALBLogsSourceApiUrl: !If [ create_alb_logs_source, "", !Ref Section5cALBLogsSourceUrl ]
        ELBLogsSourceApiUrl: !If [ create_elb_logs_source, "", !Ref Section8cELBLogsSourceUrl ]
        CloudTrailLogsSourceApiUrl: !If [ create_cloudtrail_logs_source, "", !Ref Section6bCloudTrailLogsSourceUrl ]
        CloudWatchLogsSourceApiUrl: !If [ create_cloudwatch_logs_source, "", !Ref Section7bCloudWatchLogsSourceUrl ]
        MetricsSourceApiUrl: !If [ create_metrics_source, "", !Ref Section4cCloudWatchExistingSourceAPIUrl ]
        CreateELBLogSource: !Ref Section8bELBCreateLogSource
        CreateELBS3Bucket: !If [create_elb_bucket, "Yes", "No"]
        ELBS3LogsBucketName: !Ref Section8dELBS3LogsBucketName
        ELBS3BucketPathExpression: !Join
          - ""
          - - !If [elb_bucket_path_expression_provided,!Ref Section8eELBS3BucketPathExpression, "classicloadbalancing"]
            - "/AWSLogs/"
            - !Ref AWS::AccountId
            - "/elasticloadbalancing/"
            - !Ref AWS::Region
            - "/*.log"
        ELBLogsSourceName: !Sub "classic-lb-logs-${AWS::Region}"
        ELBLogsSourceCategory: !FindInMap [CommonData, CollectorDetails, ELBLogsSourceCategory]

  AutoEnableOptions:
    Type: AWS::CloudFormation::Stack
    Condition: call_auto_enable
    Properties:
      TemplateURL: !Sub
        - "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}auto_enable.template.yaml"
        - MPS3BucketName: !FindInMap [CommonData, NestedTemplate, MPS3BucketName]
          MPS3BucketRegion: !FindInMap [CommonData, NestedTemplate, MPS3BucketRegion]
          MPS3KeyPrefix: !FindInMap [CommonData, NestedTemplate, MPS3KeyPrefix]
      Parameters:
        SumoLogicResourceRemoveOnDeleteStack: !Ref Section1eSumoLogicResourceRemoveOnDeleteStack
        ALBAutoEnableS3Logs: !If [auto_enable_s3_logs, "Yes", "No"]
        ALBAutoEnableS3LogsOptions: !Ref Section5aAutoEnableS3LogsALBResourcesOptions
        ALBS3LogsBucketName: !If [create_alb_bucket, !GetAtt CreateCommonResources.Outputs.BucketName, !Ref Section5dALBS3LogsBucketName]
        AutoSubscribeLogGroups: !If [create_kf_logs_source, "Yes", !If [ create_cw_logs_source, "Yes", "No" ] ]
        AutoSubscribeLogGroupsLambdaOptions: !Ref Section7cAutoSubscribeLogGroupsOptions
        AutoSubscribeDestinationARNType: !If [create_kf_logs_source, "Kinesis",  "Lambda" ]
        AutoSubscribeDestinationARN: !If [create_kf_logs_source, !GetAtt CreateCommonResources.Outputs.KinesisLogsDeliveryStreamARN, !If [ create_cw_logs_source, !GetAtt CreateCommonResources.Outputs.CloudWatchLambdaARN, "" ] ]
        AutoSubscribeLambdaLogGroupPattern: !Ref Section7dAutoSubscribeLogGroupPattern
        AutoSubscribeLogGroupByTags: !Ref Section7eAutoSubscribeLogGroupByTags
        AutoSubscribeRoleArn: !If [create_kf_logs_source, !GetAtt CreateCommonResources.Outputs.KinesisLogsRoleARN,  "" ]
        ELBAutoEnableS3Logs: !If [auto_enable_s3_logs_elb, "Yes", "No"]
        ELBAutoEnableS3LogsOptions: !Ref Section8aAutoEnableS3LogsELBResourcesOptions
        ELBS3LogsBucketName: !If [create_elb_bucket, !GetAtt CreateCommonResources.Outputs.BucketName, !Ref Section8dELBS3LogsBucketName]
        ELBS3LogsBucketPrefix: !If [elb_bucket_path_expression_provided, !Ref Section8eELBS3BucketPathExpression, "classicloadbalancing"]
        MPS3BucketName: !FindInMap [CommonData, NestedTemplate, MPS3BucketName]
        MPS3BucketRegion: !FindInMap [CommonData, NestedTemplate, MPS3BucketRegion]
        MPS3KeyPrefix: !FindInMap [CommonData, NestedTemplate, MPS3KeyPrefix]

  sumoAppStacks:
    Type: AWS::CloudFormation::Stack
    Condition: install_observability_apps
    Properties:
      TemplateURL: !Sub
        - "https://${MPS3BucketName}.s3.${MPS3BucketRegion}.${AWS::URLSuffix}/${MPS3KeyPrefix}apps.template.yaml"
        - MPS3BucketName: !FindInMap [CommonData, NestedTemplate, MPS3BucketName]
          MPS3BucketRegion: !FindInMap [CommonData, NestedTemplate, MPS3BucketRegion]
          MPS3KeyPrefix: !FindInMap [CommonData, NestedTemplate, MPS3KeyPrefix]
      Parameters:
        # -------------------------
        # Sumo Deployment
        # -------------------------
        Section1aSumoDeployment: !Ref Section1aSumoLogicDeployment
        Section1bSumoAccessID: !Ref Section1bSumoLogicAccessID
        Section1cSumoAccessKey: !Ref Section1cSumoLogicAccessKey
        Section1dRemoveSumoResourcesOnDeleteStack: !Ref Section1eSumoLogicResourceRemoveOnDeleteStack
        # -------------------------
        # App Installation
        # -------------------------
        Section2aInstallApp: !GetAtt CreateCommonResources.Outputs.PaidAccountCheck
        # -------------------------
        # Parent Stack Details
        # -------------------------
        Section3aParentStackLambdaARN:
          !GetAtt CreateCommonResources.Outputs.LambdaHelperARN
        # -------------------------
        # UPDATE TRIGGER HASH (Recommended)
        # -------------------------
        Section4aToUpdate:
          Fn::Base64: !Sub
            - "${a}-${b}-${c}-${d}-${e}-${f}-${g}-${h}-${i}-${j}-${k}-${l}-${m}-${n}-${o}-${p}-${q}-${r}-${s}-${t}-${u}-${v}-${w}"
            - a: !Ref Section2aAccountAlias
              b: !Ref Section3aInstallObservabilityApps
              c: !Ref Section4aCreateMetricsSourceOptions
              d: !Ref Section4bMetricsNameSpaces
              e: !Ref Section4cCloudWatchExistingSourceAPIUrl
              f: !Ref Section4dAWSMetricsTagFilters
              g: !Ref Section5aAutoEnableS3LogsALBResourcesOptions
              h: !Ref Section5bALBCreateLogSource
              i: !Ref Section5cALBLogsSourceUrl
              j: !Ref Section5dALBS3LogsBucketName
              k: !Ref Section6aCreateCloudTrailLogSource
              l: !Ref Section6bCloudTrailLogsSourceUrl
              m: !Ref Section6cCloudTrailLogsBucketName
              n: !Ref Section7aCreateCloudWatchLogsSourceOptions
              o: !Ref Section7bCloudWatchLogsSourceUrl
              p: !Ref Section7cAutoSubscribeLogGroupsOptions
              q: !Ref Section7dAutoSubscribeLogGroupPattern
              r: !Ref Section7eAutoSubscribeLogGroupByTags
              s: !Ref Section8aAutoEnableS3LogsELBResourcesOptions
              t: !Ref Section8bELBCreateLogSource
              u: !Ref Section8cELBLogsSourceUrl
              v: !Ref Section8dELBS3LogsBucketName
              w: !FindInMap [CommonData, NestedTemplate, MPS3KeyPrefix]
